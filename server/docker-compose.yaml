# LatentSync inference API — GPU service.
#
# Port 8014: next free after wav2lip (8011), IndexTTS2 (8012), musetalk (8013).
#
# Model layout on host (${MODEL_DIR}/models/latentsync/, default /mnt/ai-models):
#   latentsync_unet.pt        main UNet checkpoint (~4.8 GB — LatentSync-1.6)
#   whisper/tiny.pt           Whisper tiny audio encoder (~73 MB)
#   insightface/              InsightFace face-detection weights
#                             (auto-downloaded by insightface lib on first run)
#
# Run via setup.sh (recommended):
#   DOCKER_PAT=xxx bash setup.sh
#
# Or manually:
#   docker compose -f server/docker-compose.yaml up -d
#   MODEL_DIR=/custom/path BASE_URL=http://1.2.3.4:8014 docker compose -f server/docker-compose.yaml up -d

services:
  latentsync:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: docker4zerocool/ai-latentsync:latest
    # Renamed from ai-latentsync 2026-05-14: collided with production-style
    # naming on the home gpu node and got auto-spun-up whenever the
    # LatentSync-API workspace opened in a Dev Container, squatting ~19 GiB
    # on GPU 1 next to vLLM. Production deployment lives on Brev L40S
    # (project_latentsync_api memory). Host port 8114 (was 8014) keeps dev
    # traffic from accidentally hitting the canonical 80xx ai-services range.
    container_name: latentsync-devcontainer
    restart: unless-stopped
    ports:
      - "8114:8014"
    environment:
      LATENTSYNC_CKPT_PATH:    /models/latentsync_unet.pt
      LATENTSYNC_WHISPER_PATH: /models/whisper/tiny.pt
      LATENTSYNC_CONFIG:       /app/latentsync/configs/unet/stage2_512.yaml
      LATENTSYNC_STEPS:        "20"
      LATENTSYNC_GUIDANCE:     "1.5"
      JOB_TTL_SECONDS:         "3600"
      BASE_URL:                "${BASE_URL:-https://mcp.baisoln.com/gpu-ai}"
      HF_HOME:                 /mnt/hf_cache
      LOG_LEVEL:               "info"

    volumes:
      - ${MODEL_DIR:-/mnt/ai-models}/models/latentsync:/models:ro
      - ${MODEL_DIR:-/mnt/ai-models}/models/latentsync/insightface:/root/.insightface
      - ${MODEL_DIR:-/mnt/ai-models}/models/hf_cache:/mnt/hf_cache
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro

    runtime: nvidia
    # Pin to a single GPU by UUID instead of "count: all". With count:all the
    # container grabbed every GPU and LatentSync defaulted to cuda:0, colliding
    # with whatever else lived there and OOMing. GPU 0 = RTX 5090 (32 GB), GPU 1
    # = RTX PRO 6000 (96 GB) but the latter is ~fully held by the vLLM
    # qwen3.6-35b server, so the 5090 (GPU 0) has the most free VRAM. Pin there.
    # To repin, swap the UUID (nvidia-smi -L) or use NVIDIA_VISIBLE_DEVICES.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-520e01f2-cf30-6396-abef-e8e9a5233b0e"]  # RTX 5090 (GPU 0)
              capabilities: [gpu]
